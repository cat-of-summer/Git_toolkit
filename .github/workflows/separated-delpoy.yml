name: separated-delpoy

on:
  workflow_dispatch:
    inputs:
      commits:
        description: 'Comma-separated commits to deploy'
        required: true
        type: string
      deploy_mirror:
        description: 'Delete files removed in these commits (true/false)'
        required: false
        type: string
        default: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_LOCAL_DIR: ${{ vars.DEPLOY_LOCAL_DIR || './' }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_MIRROR: ${{ inputs.deploy_mirror || 'false' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SETUP SSH KEY
        if: ${{ env.DEPLOY_METHOD == 'RSYNC' }}
        shell: bash
        run: |
          TMP_KEY=$(mktemp)
          echo "$DEPLOY_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"
          echo "TMP_KEY=$TMP_KEY" >> "$GITHUB_ENV"

      - name: BUILD
        if: ${{ env.BUILD_COMMAND != '' }}
        shell: bash
        run: |
          set -euo pipefail

          npm ci

          $BUILD_COMMAND

      - name: Cache lftp
        if: ${{ env.DEPLOY_METHOD == 'FTP' }}
        id: cache-lftp
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-lftp

      - name: RESOLVE CHANGED FILES
        shell: bash
        run: |
          set -euo pipefail

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"
          > "$UPLOAD_FILE"
          > "$DELETE_FILE"

          # Normalize DEPLOY_LOCAL_DIR: strip trailing slash and leading ./
          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          # Parse commits: supports commas, spaces, tabs, newlines as separators
          readarray -t COMMITS_ARR < <(echo "${{ inputs.commits }}" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')

          for commit in "${COMMITS_ARR[@]}"; do
            commit="${commit// /}"
            [ -z "$commit" ] && continue
            echo "=== Processing commit: $commit ==="

            # Files added / copied / modified / renamed
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -z "$LOCAL_DIR" ]; then
                echo "$file" >> "$UPLOAD_FILE"
              elif [[ "$file" == "$LOCAL_DIR/"* ]]; then
                stripped="${file#"$LOCAL_DIR/"}"
                echo "$stripped" >> "$UPLOAD_FILE"
              fi
            done < <(git diff-tree --no-commit-id -r --name-only --diff-filter=ACMR "$commit")

            # Files deleted — collected only when DEPLOY_MIRROR=true
            if [ "${DEPLOY_MIRROR}" = "true" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if [ -z "$LOCAL_DIR" ]; then
                  echo "$file" >> "$DELETE_FILE"
                elif [[ "$file" == "$LOCAL_DIR/"* ]]; then
                  stripped="${file#"$LOCAL_DIR/"}"
                  echo "$stripped" >> "$DELETE_FILE"
                fi
              done < <(git diff-tree --no-commit-id -r --name-only --diff-filter=D "$commit")
            fi
          done

          # Deduplicate
          sort -u -o "$UPLOAD_FILE" "$UPLOAD_FILE"
          sort -u -o "$DELETE_FILE" "$DELETE_FILE"

          echo "--- Files to upload ---"
          cat "$UPLOAD_FILE"
          echo "--- Files to delete ---"
          cat "$DELETE_FILE"

          if ! [ -s "$UPLOAD_FILE" ] && ! [ -s "$DELETE_FILE" ]; then
            echo "::warning::No files match DEPLOY_LOCAL_DIR='${DEPLOY_LOCAL_DIR}' in the specified commits"
          fi

      - name: FTP DEPLOY
        if: ${{ env.DEPLOY_METHOD == 'FTP' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.cache-lftp.outputs.cache-hit }}" = "true" ] && ls /var/cache/apt/archives/lftp_*.deb &>/dev/null; then
            sudo dpkg -i /var/cache/apt/archives/lftp_*.deb || sudo apt-get install -f -y --no-install-recommends
          else
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends lftp
          fi

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          {
            echo "set net:timeout 30"
            echo "set net:max-retries 5"
            echo "set net:reconnect-interval-base 5"
            echo "set ftp:passive-mode true"
            echo "set ssl:verify-certificate no"
            echo "set cmd:fail-exit true"

            if [ -s "$UPLOAD_FILE" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if [ -z "$LOCAL_DIR" ]; then
                  src_path="./$file"
                else
                  src_path="./$LOCAL_DIR/$file"
                fi
                file_dir=$(dirname "$file")
                if [ "$file_dir" = "." ]; then
                  remote_dir="$DEPLOY_PATH"
                else
                  remote_dir="$DEPLOY_PATH/$file_dir"
                fi
                echo "mkdir -fp \"$remote_dir\""
                echo "put -O \"$remote_dir\" \"$src_path\""
              done < "$UPLOAD_FILE"
            fi

            if [ -s "$DELETE_FILE" ]; then
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                echo "rm -f \"$DEPLOY_PATH/$file\""
              done < "$DELETE_FILE"
            fi

            echo "quit"
          } | lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST"

      - name: RSYNC DEPLOY
        if: ${{ env.DEPLOY_METHOD == 'RSYNC' }}
        shell: bash
        run: |
          set -euo pipefail

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""
          if [ -z "$LOCAL_DIR" ]; then
            SRC_DIR="./"
          else
            SRC_DIR="$LOCAL_DIR/"
          fi

          if [ -s "$UPLOAD_FILE" ]; then
            rsync -avz --progress \
              -e "ssh -i $TMP_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p $DEPLOY_PORT" \
              --files-from="$UPLOAD_FILE" \
              --ignore-missing-args \
              --no-perms --no-owner --no-group \
              "$SRC_DIR" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
          else
            echo "No files to upload."
          fi

          if [ "${DEPLOY_MIRROR}" = "true" ] && [ -s "$DELETE_FILE" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              ssh -i "$TMP_KEY" \
                -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p "$DEPLOY_PORT" \
                "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$DEPLOY_PATH/$file\""
            done < "$DELETE_FILE"
          fi

      - name: POST DEPLOY COMMAND
        if: ${{ env.DEPLOY_COMMAND != '' && env.DEPLOY_METHOD != 'FTP' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            cd $DEPLOY_PATH
            $DEPLOY_COMMAND
          "

      - name: CLEANUP SSH KEY
        if: always()
        shell: bash
        run: |
          [ -n "${TMP_KEY:-}" ] && [ -f "$TMP_KEY" ] && rm -f "$TMP_KEY" || true
