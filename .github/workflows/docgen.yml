name: Generate docs structure

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  docgen:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user for commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate docs structure
        run: |
          set -euo pipefail

          DOCS_DIR=".docs"
          DOCIGNORE="$DOCS_DIR/.docignore"

          # ── 1. Create .docs directory ─────────────────────────────
          mkdir -p "$DOCS_DIR"

          # ── 2. Create .docignore with defaults if not exists ──────
          if [ ! -f "$DOCIGNORE" ]; then
            cat > "$DOCIGNORE" << 'IGNORE_EOF'
          # ═══════════════════════════════════════════════
          # .docignore — blacklist for docs generation
          # Syntax: *.ext, dirname/, filename. Comments: #
          # ═══════════════════════════════════════════════

          # Images
          *.png
          *.jpg
          *.jpeg
          *.gif
          *.bmp
          *.ico
          *.webp
          *.tiff
          *.tif
          *.svg
          *.avif
          *.heic
          *.heif
          *.raw
          *.cr2
          *.nef

          # Documents
          *.doc
          *.docx
          *.pdf
          *.xls
          *.xlsx
          *.ppt
          *.pptx
          *.odt
          *.ods
          *.odp
          *.rtf
          *.epub

          # Audio
          *.mp3
          *.wav
          *.ogg
          *.flac
          *.aac
          *.wma
          *.m4a

          # Video
          *.mp4
          *.avi
          *.mov
          *.wmv
          *.flv
          *.mkv
          *.webm
          *.m4v
          *.mpeg
          *.mpg

          # Fonts
          *.ttf
          *.otf
          *.woff
          *.woff2
          *.eot

          # Archives
          *.zip
          *.rar
          *.7z
          *.tar
          *.gz
          *.bz2
          *.xz
          *.tgz

          # Binaries & executables
          *.exe
          *.dll
          *.so
          *.dylib
          *.bin
          *.msi
          *.dmg
          *.deb
          *.rpm
          *.app

          # Compiled / object files
          *.o
          *.obj
          *.pyc
          *.pyo
          *.class
          *.jar
          *.war

          # Design files
          *.psd
          *.ai
          *.sketch
          *.fig
          *.xd

          # Database
          *.sqlite
          *.db
          *.mdb

          # Source maps & minified
          *.map
          *.min.js
          *.min.css

          # Lock files
          package-lock.json
          yarn.lock
          composer.lock
          Gemfile.lock
          poetry.lock
          pnpm-lock.yaml

          # Directories
          node_modules/
          vendor/
          dist/
          build/
          .git/
          .github/
          .docs/
          __pycache__/
          .cache/
          .tmp/
          .vscode/
          .idea/
          bower_components/
          IGNORE_EOF
            sed -i 's/^          //' "$DOCIGNORE"
            echo "Created default $DOCIGNORE"
          fi

          # ── 3. Parse .docignore into grep -E pattern ──────────────
          build_exclude_pattern() {
            local patterns=()
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -z "$line" || "$line" == \#* ]] && continue

              if [[ "$line" == */ ]]; then
                local dir="${line%/}"
                local esc
                esc="$(printf '%s' "$dir" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
                patterns+=("(^|/)${esc}(/|$)")
              elif [[ "$line" == \*.* ]]; then
                local ext="${line#\*.}"
                local esc
                esc="$(printf '%s' "$ext" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
                patterns+=("\\.${esc}$")
              else
                local esc
                esc="$(printf '%s' "$line" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
                patterns+=("(^|/)${esc}$")
              fi
            done < "$1"

            local result=""
            for p in "${patterns[@]}"; do
              result+="${result:+|}${p}"
            done
            echo "$result"
          }

          EXCLUDE_PATTERN="$(build_exclude_pattern "$DOCIGNORE")"

          # ── 4. Get filtered file list ─────────────────────────────
          mapfile -t ALL_FILES < <(
            find . -not -path './.docs/*' -not -path './.git/*' -type f \
              | sed 's|^\./||' \
              | { [[ -n "$EXCLUDE_PATTERN" ]] && grep -viE "$EXCLUDE_PATTERN" || cat; } \
              | sort
          )

          echo "Found ${#ALL_FILES[@]} source files to document"

          # ── Pass 1: Sync — delete orphans, create new ─────────────

          TMPDIR_WORK="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR_WORK"' EXIT

          printf '%s\n' "${ALL_FILES[@]}" | sort > "$TMPDIR_WORK/source.txt"

          if find "$DOCS_DIR" -type f -name '*.md' ! -name 'README.md' | head -1 | grep -q .; then
            find "$DOCS_DIR" -type f -name '*.md' ! -name 'README.md' -printf '%P\n' \
              | sed 's/\.md$//' | sort > "$TMPDIR_WORK/existing.txt"
          else
            touch "$TMPDIR_WORK/existing.txt"
          fi

          comm -23 "$TMPDIR_WORK/existing.txt" "$TMPDIR_WORK/source.txt" > "$TMPDIR_WORK/orphans.txt"
          comm -23 "$TMPDIR_WORK/source.txt" "$TMPDIR_WORK/existing.txt" > "$TMPDIR_WORK/new.txt"

          orphan_count=0
          while IFS= read -r orphan; do
            [[ -z "$orphan" ]] && continue
            md_path="$DOCS_DIR/${orphan}.md"
            if [ -f "$md_path" ]; then
              rm -f "$md_path"
              echo "  DELETE: $md_path"
              ((orphan_count++)) || true
            fi
          done < "$TMPDIR_WORK/orphans.txt"

          find "$DOCS_DIR" -mindepth 1 -type d -empty -delete 2>/dev/null || true

          new_count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            md_path="$DOCS_DIR/${file}.md"
            mkdir -p "$(dirname "$md_path")"
            filename="$(basename "$file")"
            echo "# ${filename}" > "$md_path"
            echo "  CREATE: $md_path"
            ((new_count++)) || true
          done < "$TMPDIR_WORK/new.txt"

          echo "Pass 1 done: +${new_count} new, -${orphan_count} orphans"

          # ── Pass 2: Generate README.md indexes (always overwrite) ──

          generate_index() {
            local dir="$1"
            local readme="$dir/README.md"

            if [[ "$dir" == "$DOCS_DIR" ]]; then
              local title="Документация"
            else
              local title
              title="$(basename "$dir")"
            fi

            local subdirs=()
            for entry in "$dir"/*/; do
              [[ ! -d "$entry" ]] && continue
              subdirs+=("$(basename "$entry")")
            done

            local files=()
            for entry in "$dir"/*.md; do
              [[ ! -f "$entry" ]] && continue
              local name
              name="$(basename "$entry")"
              [[ "$name" == "README.md" ]] && continue
              files+=("$name")
            done

            {
              echo "# ${title}"
              echo ""

              if [[ ${#subdirs[@]} -gt 0 ]]; then
                echo "## Папки"
                echo ""
                for d in "${subdirs[@]}"; do
                  echo "- [${d}](${d}/README.md)"
                done
                echo ""
              fi

              if [[ ${#files[@]} -gt 0 ]]; then
                echo "## Файлы"
                echo ""
                for f in "${files[@]}"; do
                  local original_name="${f%.md}"
                  echo "- [${original_name}](${f})"
                done
                echo ""
              fi
            } > "$readme"
          }

          while IFS= read -r dir; do
            generate_index "$dir"
          done < <(find "$DOCS_DIR" -type d | sort -r)

          index_count="$(find "$DOCS_DIR" -type f -name 'README.md' | wc -l)"
          echo "Pass 2 done: ${index_count} index files generated"

      - name: Stage docs changes
        run: |
          set -euo pipefail
          git add .docs/
          git rm -r --cached node_modules 2>/dev/null || true

      - name: Commit & push if there are changes
        run: |
          set -uo pipefail
          if git diff --cached --quiet; then
            echo "No docs changes to commit"
            exit 0
          fi

          git commit -m "auto:generated_doc [skip ci]"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
